[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mx3sw"
version = "0.3.0"
description = "Small helpers for spin-wave analysis of MuMax3 simulations"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Subhrojyoti Mandal" }]
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "pandas"]
keywords = ["mumax3", "micromagnetics", "spin waves", "magnonics", "OVF"]

[project.optional-dependencies]
plot = ["matplotlib"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
